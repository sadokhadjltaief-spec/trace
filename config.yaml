# All hand-set parameters live here. The benchmarks run a sensitivity check over the bayes block.
bayes:
  p_hit: 0.70              # P(option mapped to h | h)
  p_correct_m0: 0.85       # P(correct | M0)
  p_correct_despite: 0.30  # P(correct | h != M0)
  k_conf: 1.3              # wrong + sure multiplier
  unsure_power: 0.6        # wrong + not sure tempering exponent
  tau: 0.5                 # explanation-detector temperature
  stop_threshold: 0.85
  max_questions: 5
  smoothing: 1             # add-one smoothing for MAP frequencies
  eps: 0.02                # floor for any (q, h, option) likelihood before normalising (avoids log 0)
  use_map_data: true       # replace defaults with MAP frequencies where MAP covers (q, h)
  fragile_power: 0.6       # right + not sure: tempered ("small") update, flagged fragile

llm:
  # model names come from .env: LLM_MODEL (live tutor, drafting) and EVAL_MODEL (bulk evals)
  timeout_s: 60
  retries: 6                 # total attempts on 429 / 5xx / timeouts
  backoff_base_s: 2.0        # exponential backoff base when no retry-after header is sent
  backoff_max_s: 60.0
  min_interval_s: 2.0        # our own throttle between request starts, per model (not a provider number)
  batch_workers: 2           # concurrent workers for bulk evals; the throttle still applies
  reasoning_effort: low      # gpt-oss models on Groq accept low / medium / high
  max_tokens: 2048
  cache_dir: .cache/llm
  log_db: .cache/trace.db
  # Groq free tier (rate-limited). Prices stay null on purpose; cost.json reports tokens only.
  cost_label: "free tier, rate-limited"
  price_input_per_m: null
  price_output_per_m: null

seed: 42
demo_mode: false
