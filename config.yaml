# All hand-set parameters live here. The benchmarks run a sensitivity check over the bayes block.
bayes:
  p_hit: 0.70              # P(option mapped to h | h)
  p_correct_m0: 0.85       # P(correct | M0)
  p_correct_despite: 0.30  # P(correct | h != M0)
  k_conf: 1.3              # wrong + sure multiplier
  unsure_power: 0.6        # wrong + not sure tempering exponent
  tau: 0.5                 # explanation-detector temperature
  stop_threshold: 0.85
  max_questions: 5
  smoothing: 1             # add-one smoothing for MAP frequencies
  eps: 0.02                # floor for any (q, h, option) likelihood before normalising (avoids log 0)
  use_map_data: true       # replace defaults with MAP frequencies where MAP covers (q, h)
  fragile_power: 0.6       # right + not sure: tempered ("small") update, flagged fragile

llm:
  # model names come from .env: LLM_MODEL (live tutor, drafting) and EVAL_MODEL (bulk evals)
  timeout_s: 60
  retries: 6                 # total attempts on 429 / 5xx / timeouts
  backoff_base_s: 2.0        # exponential backoff base when no retry-after header is sent
  backoff_max_s: 60.0
  min_interval_s: 2.0        # our own throttle between request starts, per model (not a provider number)
  # Groq free tier headers read on 2026-11-21: 1000 requests/day and 8000 tokens/min per model.
  tpm_budget: 7000           # our sliding 60 s token budget per model (kept under the 8000 TPM limit)
  batch_workers: 2           # concurrent workers for bulk evals; the throttle still applies
  reasoning_effort: low      # gpt-oss models on Groq accept low / medium / high
  max_tokens: 2048
  # guard judge model. EVAL_MODEL (20b) hit Groq's free-tier DAILY token cap (200k TPD per model) on
  # 2026-11-21 after the detector eval, so the judge runs on LLM_MODEL. Empty = EVAL_MODEL.
  judge_model: openai/gpt-oss-120b
  cache_dir: .cache/llm
  log_db: .cache/trace.db
  # Groq free tier (rate-limited). Prices stay null on purpose; cost.json reports tokens only.
  cost_label: "free tier, rate-limited"
  price_input_per_m: null
  price_output_per_m: null

detector:
  rank_weights: [0.7, 0.2, 0.1]   # LLM ranking -> distribution (fixed by code; the LLM gives no numbers)
  rank_floor: 0.01
  fewshot_k: 8
  eval_sample: 400                # held-out rows for the LLM variants
  batch_fewshot: 5                # items per LLM call (free tier: 1000 requests/day)
  batch_zeroshot: 20

live:
  # Only human-verified bank items are used live. While the review is pending, dev mode may use
  # unverified questions; the session then carries a visible warning. Set to false for the real demo.
  allow_unverified_dev: False

seed: 42
demo_mode: false

guards:
  congruency_threshold: 0.2     # check the message against every misconception above this posterior

rag:
  chunk_words: 300          # ~300-500 tokens per chunk
  top_k: 5
  rrf_k: 60                 # reciprocal rank fusion constant
  # e5 cosines are compressed: same-language relevant ~0.90, unrelated ~0.80 (checked 2026-11-21). Cross-language
  # (FR query -> AR passage) scored 0.81, i.e. NOT separable: such hits only count if BM25 also matches.
  min_cosine: 0.85
  embed_model: intfloat/multilingual-e5-small
